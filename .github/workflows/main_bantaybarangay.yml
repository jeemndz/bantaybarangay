name: Build and deploy Python app to Azure Web App - BantayBarangay

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # PYTHON
      # -------------------------------------------------------

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'


      # -------------------------------------------------------
      # SHOW PROJECT STRUCTURE
      # -------------------------------------------------------

      - name: Show project structure
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root:"
          ls -la

          echo ""
          echo "Looking for manage.py:"
          find . -maxdepth 3 -name "manage.py" -print

          echo ""
          echo "Looking for wsgi.py:"
          find . -maxdepth 4 -name "wsgi.py" -print


      # -------------------------------------------------------
      # INSTALL DEPENDENCIES
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -------------------------------------------------------
      # VERIFY DJANGO PROJECT PACKAGE
      # -------------------------------------------------------

      - name: Verify BantayBarangay package
        run: |
          python -c "import bantaybarangay; print('Project package:', bantaybarangay.__file__)"


      # -------------------------------------------------------
      # VERIFY WSGI
      # -------------------------------------------------------

      - name: Verify Django WSGI
        run: |
          python -c "import bantaybarangay.wsgi; print('WSGI import successful')"


      # -------------------------------------------------------
      # DJANGO SYSTEM CHECK
      # -------------------------------------------------------

      - name: Run Django system check
        run: |
          python manage.py check


      # -------------------------------------------------------
      # CREATE DEPLOYMENT ARTIFACT
      # -------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4

        with:
          name: python-app

          path: |
            .
            !.git/
            !.github/
            !.vscode/
            !antenv/
            !__pycache__/
            !**/__pycache__/


  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:

    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      # -------------------------------------------------------
      # DOWNLOAD ARTIFACT
      # -------------------------------------------------------

      - name: Download artifact
        uses: actions/download-artifact@v4

        with:
          name: python-app
          path: .


      # -------------------------------------------------------
      # VERIFY DOWNLOADED ARTIFACT
      # -------------------------------------------------------

      - name: Verify deployment artifact
        run: |
          echo "Deployment directory:"
          pwd

          echo ""
          echo "Deployment files:"
          ls -la

          echo ""
          echo "manage.py:"
          find . -maxdepth 3 -name "manage.py" -print

          echo ""
          echo "wsgi.py:"
          find . -maxdepth 4 -name "wsgi.py" -print


      # -------------------------------------------------------
      # AZURE LOGIN
      # -------------------------------------------------------

      - name: Login to Azure
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5D8AAFDACE18451C9F5C1F2FAD6CBF02 }}

          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_286B12C6315143A293223C3A2C36673E }}

          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0F13D6B15FA54340877C50CFA025139F }}


      # -------------------------------------------------------
      # DEPLOY
      # -------------------------------------------------------

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3

        id: deploy-to-webapp

        with:
          app-name: 'BantayBarangay'
          slot-name: 'Production'
          package: .
