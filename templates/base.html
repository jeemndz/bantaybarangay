{% load static %}

<!DOCTYPE html>
<html lang="en" class="h-full">

<head>

    <!-- =====================================================
         META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="color-scheme"
        content="light"
    >

    <meta
        name="theme-color"
        content="#064e3b"
    >


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <title>
        {% block title %}BantayBarangay{% endblock %}
    </title>


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'images/logo.png' %}"
    >


    <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: [
                            "Inter",
                            "Arial",
                            "Helvetica",
                            "sans-serif"
                        ]
                    }
                }
            }
        };
    </script>


    <!-- =====================================================
         SHARED CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/sidebar.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/topbar.css' %}"
    >


    <!-- =====================================================
         BASIC GLOBAL RESET
    ====================================================== -->

    <style>

        html,
        body {
            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;
        }


        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;

            overflow-x: hidden;

            background: #f8fafc;
        }


        /* =================================================
           HIDE SIDEBAR SCROLLBAR
        ================================================= */

        .sidebar,
        .sidebar-nav {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }


        .sidebar::-webkit-scrollbar,
        .sidebar-nav::-webkit-scrollbar {
            display: none;

            width: 0;
            height: 0;
        }

    </style>


    <!-- =====================================================
         PAGE-SPECIFIC CSS
    ====================================================== -->

    {% block extra_css %}
    {% endblock %}

</head>


<body
    class="
        min-h-screen
        overflow-x-hidden
        bg-slate-50
        font-sans
        text-slate-800
        antialiased
    "
>


    <!-- =====================================================
         APPLICATION
    ====================================================== -->

    <div
        id="app"
        class="relative min-h-screen w-full"
    >


        <!-- =================================================
             SHARED SIDEBAR
        ================================================== -->

        {% include 'partials/sidebar.html' %}


        <!-- =================================================
             MAIN APPLICATION AREA
        ================================================== -->

        <div
            id="main-content"
            class="main-content"
        >


            <!-- =============================================
                 SHARED TOPBAR

                 Uses:
                 templates/partials/topbar.html
            ============================================== -->

            <div
                id="topbar-container"
                class="topbar-container"
            >

                {% include 'partials/topbar.html' %}

            </div>


            <!-- =============================================
                 PAGE CONTENT
            ============================================== -->

            <main
                id="page-content"
                class="page-content"
            >

                {% block content %}
                {% endblock %}

            </main>


        </div>

    </div>


    <!-- =====================================================
         GLOBAL JAVASCRIPT
    ====================================================== -->

    <script
        src="{% static 'js/sidebar.js' %}"
        defer
    ></script>


    <script
        src="{% static 'js/topbar.js' %}"
        defer
    ></script>


    <!-- =====================================================
         PAGE-SPECIFIC JAVASCRIPT
    ====================================================== -->

    {% block extra_js %}
    {% endblock %}


</body>

</html>
