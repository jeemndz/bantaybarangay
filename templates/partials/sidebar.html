<!-- =========================================================
     SETTINGS DROPDOWN SCRIPT
========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const settingsButton =
            document.getElementById(
                "settingsMenuButton"
            );

        const settingsMenu =
            document.getElementById(
                "settingsSubmenu"
            );

        const settingsArrow =
            document.getElementById(
                "settingsMenuArrow"
            );


        if (
            !settingsButton ||
            !settingsMenu ||
            !settingsArrow
        ) {
            return;
        }


        let settingsOpen =
            settingsButton
                .getAttribute(
                    "aria-expanded"
                )
                .trim() === "true";


        function updateSettingsMenu() {

            settingsButton.setAttribute(
                "aria-expanded",
                settingsOpen
                    ? "true"
                    : "false"
            );


            if (settingsOpen) {

                settingsMenu.classList.remove(
                    "grid-rows-[0fr]",
                    "opacity-0"
                );

                settingsMenu.classList.add(
                    "grid-rows-[1fr]",
                    "opacity-100"
                );

                settingsArrow.classList.add(
                    "rotate-180"
                );

            } else {

                settingsMenu.classList.remove(
                    "grid-rows-[1fr]",
                    "opacity-100"
                );

                settingsMenu.classList.add(
                    "grid-rows-[0fr]",
                    "opacity-0"
                );

                settingsArrow.classList.remove(
                    "rotate-180"
                );

            }

        }


        settingsButton.addEventListener(
            "click",
            function () {

                settingsOpen =
                    !settingsOpen;

                updateSettingsMenu();

            }
        );


        updateSettingsMenu();

    }
);

</script>
