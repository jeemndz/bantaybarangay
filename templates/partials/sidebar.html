{% load static %}

<!-- =========================================================
     MOBILE SIDEBAR TOGGLE
========================================================= -->

<button
    type="button"
    id="sidebarToggle"
    class="sidebar-toggle"
    aria-label="Open navigation menu"
    aria-controls="sidebar"
    aria-expanded="false"
>
    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
    >
        <path d="M4 6h16"></path>
        <path d="M4 12h16"></path>
        <path d="M4 18h16"></path>
    </svg>
</button>


<!-- =========================================================
     MOBILE BACKDROP
========================================================= -->

<div
    id="sidebarBackdrop"
    class="sidebar-backdrop"
    aria-hidden="true"
></div>


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
    id="sidebar"
    class="sidebar"
    aria-label="Main navigation"
>

    <!-- =====================================================
         LOGO
    ====================================================== -->

    <div class="sidebar-logo">

        <div class="sidebar-logo-image">

            <img
                src="{% static 'images/logo.png' %}"
                alt="BantayBarangay"
            >

        </div>


        <div class="sidebar-logo-text">

            <h2>
                BantayBarangay
            </h2>

            <span>
                Barangay Management
            </span>

        </div>


        <!-- MOBILE CLOSE -->

        <button
            type="button"
            id="sidebarClose"
            class="sidebar-close"
            aria-label="Close navigation menu"
        >

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M6 6l12 12"></path>
                <path d="M18 6L6 18"></path>
            </svg>

        </button>

    </div>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav class="sidebar-nav">

        <!-- =================================================
             MAIN
        ================================================== -->

        <div class="nav-section">

            <p class="nav-title">
                Main
            </p>


            <!-- DASHBOARD -->

            <a
                href="{% url 'dashboard' %}"
                class="nav-item
                    {% if request.resolver_match.url_name == 'dashboard' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <rect
                        x="3"
                        y="3"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="14"
                        y="3"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="3"
                        y="14"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>

                    <rect
                        x="14"
                        y="14"
                        width="7"
                        height="7"
                        rx="1"
                    ></rect>
                </svg>

                <span>
                    Dashboard
                </span>

            </a>


            <!-- COMPLAINTS -->

            <a
                href="{% url 'complaints' %}"
                class="nav-item
                    {% if request.resolver_match.url_name == 'complaints' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v3.5m0 3h.01M10.3 4.8L2.9 18a1.5 1.5 0 001.3 2.25h15.6A1.5 1.5 0 0021.1 18L13.7 4.8a1.95 1.95 0 00-3.4 0z"
                    />

                </svg>

                <span>
                    Complaints
                </span>

            </a>


            <!-- HEARINGS -->

            <a
                href="{% url 'hearingmodule:hearing_schedule' %}"
                class="nav-item
                    {% if request.resolver_match.namespace == 'hearingmodule' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <rect
                        x="3"
                        y="5"
                        width="18"
                        height="16"
                        rx="2"
                    ></rect>

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 3v4M16 3v4M3 10h18"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 14h3M8 17h6"
                    />

                </svg>

                <span>
                    Hearings
                </span>

            </a>


            <!-- RESIDENTS -->

            <a
                href="{% url 'resident_list' %}"
                class="nav-item
                    {% if request.resolver_match.url_name == 'resident_list' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"
                    />

                    <circle
                        cx="9"
                        cy="7"
                        r="4"
                    ></circle>

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"
                    />

                </svg>

                <span>
                    Residents
                </span>

            </a>


            <!-- EVIDENCE MANAGEMENT -->

            <a
                href="{% url 'evidencemodule:evidence_list' %}"
                class="nav-item
                    {% if request.resolver_match.namespace == 'evidencemodule' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 13l2.5 2.5L16 10"
                    />

                </svg>

                <span>
                    Evidence Management
                </span>

            </a>


            <!-- DOCUMENT REQUESTS -->

            <a
                href="{% url 'docrequestmodule:request_documents' %}"
                class="nav-item
                    {% if request.resolver_match.namespace == 'docrequestmodule' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2v6h6"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 12h4M8 16h8"
                    />

                    <circle
                        cx="17"
                        cy="17"
                        r="3"
                    ></circle>

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M17 15.5v3M15.5 17h3"
                    />

                </svg>

                <span>
                    Document Requests
                </span>

            </a>


            <!-- DOCUMENTS -->

            <a
                href="{% url 'documents:document_list' %}"
                class="nav-item
                    {% if request.resolver_match.url_name == 'document_list' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2v6h6M8 13h8M8 17h6"
                    />

                </svg>

                <span>
                    Documents
                </span>

            </a>


            <!-- BLOCKCHAIN LOGS -->

            <a
                href="{% url 'blockchain_logs' %}"
                class="nav-item
                    {% if request.resolver_match.url_name == 'blockchain_logs' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <rect
                        x="4"
                        y="3"
                        width="16"
                        height="18"
                        rx="2"
                    ></rect>

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 7h6M9 12h6M9 17h6"
                    />

                </svg>

                <span>
                    Blockchain Logs
                </span>

            </a>


            <!-- REPORTS & ANALYTICS -->

            <a
                href="{% url 'reportsmodule:reports' %}"
                class="nav-item
                    {% if request.resolver_match.namespace == 'reportsmodule' %}
                        active
                    {% endif %}"
            >

                <svg
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 19V5M4 19h17"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 16v-5M12 16V8M16 16v-8M20 16v-11"
                    />

                </svg>

                <span>
                    Reports &amp; Analytics
                </span>

            </a>

        </div>


        <!-- =================================================
             SYSTEM
        ================================================== -->

        <div class="nav-section">

            <p class="nav-title">
                System
            </p>


            <!-- SETTINGS -->

            <div
                id="settingsNavigation"
                class="settings-navigation"
            >

                <button
                    type="button"
                    id="settingsMenuButton"
                    aria-controls="settingsSubmenu"
                    aria-expanded="{% if request.resolver_match.namespace == 'usermanagement' or request.resolver_match.url_name == 'audit_logs' %}true{% else %}false{% endif %}"
                    class="nav-item settings-toggle
                        {% if request.resolver_match.namespace == 'usermanagement' or request.resolver_match.url_name == 'audit_logs' %}
                            active
                        {% endif %}"
                >

                    <svg
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 00-1.88-.34 1.7 1.7 0 00-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 00-1.03-1.56 1.7 1.7 0 00-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 008.46 15a1.7 1.7 0 00-1.56-1.03H6v-2.4h.9a1.7 1.7 0 001.56-1.03 1.7 1.7 0 00-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 001.88.34A1.7 1.7 0 0012.73 5V4h2.4v1a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.88-.34l.06-.06 1.7 1.7-.06.06a1.7 1.7 0 00-.34 1.88A1.7 1.7 0 0020.97 11H22v2.4h-1.03A1.7 1.7 0 0019.4 15z"
                        />

                    </svg>


                    <span>
                        Settings
                    </span>


                    <svg
                        id="settingsMenuArrow"
                        class="settings-arrow
                            {% if request.resolver_match.namespace == 'usermanagement' or request.resolver_match.url_name == 'audit_logs' %}
                                rotate
                            {% endif %}"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m6 9 6 6 6-6"
                        />

                    </svg>

                </button>


                <!-- SETTINGS SUBMENU -->

                <div
                    id="settingsSubmenu"
                    class="settings-menu
                        {% if request.resolver_match.namespace == 'usermanagement' or request.resolver_match.url_name == 'audit_logs' %}
                            is-open
                        {% endif %}"
                >

                    <div class="settings-submenu-inner">

                        <div class="settings-submenu-list">


                            <!-- USER MANAGEMENT -->

                            <a
                                href="{% url 'usermanagement:user_list' %}"
                                class="nav-item
                                    {% if request.resolver_match.namespace == 'usermanagement' %}
                                        active
                                    {% endif %}"
                            >

                                <svg
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                    stroke-width="1.8"
                                >

                                    <circle
                                        cx="9"
                                        cy="7"
                                        r="4"
                                    ></circle>

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 21v-2a6 6 0 016-6h0a6 6 0 016 6v2"
                                    />

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M16 11a4 4 0 100-8M21 21v-2a6 6 0 00-4-5.65"
                                    />

                                </svg>

                                <span>
                                    User Management
                                </span>

                            </a>


                            <!-- AUDIT LOGS -->

                            <a
                                href="{% url 'audit_logs' %}"
                                class="nav-item
                                    {% if request.resolver_match.url_name == 'audit_logs' %}
                                        active
                                    {% endif %}"
                            >

                                <svg
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                    stroke-width="1.8"
                                >

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="9"
                                    ></circle>

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M12 7v5l3 2"
                                    />

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 12a9 9 0 019-9"
                                    />

                                </svg>

                                <span>
                                    Audit Logs
                                </span>

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         BOTTOM NAVIGATION
    ====================================================== -->

    <div class="sidebar-bottom">

        <a
            href="#"
            class="nav-item"
        >

            <svg
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="1.8"
            >

                <circle
                    cx="12"
                    cy="12"
                    r="9"
                ></circle>

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9.5 9a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 3.5M12 16h.01"
                />

            </svg>

            <span>
                Help &amp; Support
            </span>

        </a>

    </div>

</aside>
