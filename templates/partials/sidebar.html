{% load static %}

<aside
    id="sidebar"
    class="sidebar fixed left-0 top-0 z-50 flex h-screen w-72 flex-col
           bg-emerald-900 text-white shadow-xl
           transition-transform duration-300 ease-in-out
           -translate-x-full lg:translate-x-0"
>

    <!-- ============================= -->
    <!-- LOGO -->
    <!-- ============================= -->

    <div class="flex h-20 items-center gap-3 border-b border-emerald-800 px-6">

        <div class="flex h-11 w-11 shrink-0 items-center justify-center">
            <img
                src="{% static 'images/logo.png' %}"
                alt="BantayBarangay"
                class="h-11 w-11 object-contain"
            >
        </div>

        <div class="min-w-0">
            <h2 class="truncate text-lg font-bold tracking-tight text-white">
                BantayBarangay
            </h2>

            <span class="text-xs font-medium text-emerald-300">
                Barangay Management
            </span>
        </div>

    </div>


    <!-- ============================= -->
    <!-- NAVIGATION -->
    <!-- ============================= -->

    <nav class="flex-1 overflow-y-auto px-4 py-6">

        <!-- MAIN -->
        <div class="mb-8">

            <p class="mb-3 px-3 text-[11px] font-bold uppercase tracking-widest text-emerald-400">
                Main
            </p>


            <!-- Dashboard -->
            <a href="{% url 'dashboard' %}" class="nav-item group mb-1 flex items-center gap-3 rounded-xl px-3 py-3
           text-sm font-medium transition-all duration-200
           {% if request.resolver_match.url_name == 'dashboard' %}
               bg-emerald-700 text-white shadow-sm
           {% else %}
               text-emerald-100 hover:bg-emerald-800 hover:text-white
           {% endif %}"
            >
                <svg
                    class="h-5 w-5 shrink-0
                        {% if request.resolver_match.url_name == 'dashboard' %}
                            text-emerald-100
                        {% else %}
                            text-emerald-300
                        {% endif %}"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>

                <span>Dashboard</span>
            </a>
            <!-- Complaints -->
            <a
                href="{% url 'complaints' %}"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl px-3 py-3
                    text-sm font-medium transition-all duration-200
                    {% if request.resolver_match.url_name == 'complaints' %}
                        bg-emerald-700 text-white shadow-sm
                    {% else %}
                        text-emerald-100 hover:bg-emerald-800 hover:text-white
                    {% endif %}"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 9v3.5m0 3h.01M10.3 4.8L2.9 18a1.5 1.5 0 001.3 2.25h15.6A1.5 1.5 0 0021.1 18L13.7 4.8a1.95 1.95 0 00-3.4 0z"
                    />
                </svg>

                <span>Complaints</span>

            </a>


            <!-- Residents -->
            <a
                href="{% url 'resident_list' %}"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl px-3 py-3
                    text-sm font-medium transition-all duration-200
                    {% if request.resolver_match.url_name == 'resident_list' %}
                        bg-emerald-700 text-white shadow-sm
                    {% else %}
                        text-emerald-100 hover:bg-emerald-800 hover:text-white
                    {% endif %}"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"
                    />
                    <circle cx="9" cy="7" r="4"></circle>
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"
                    />
                </svg>

                <span>Residents</span>

            </a>


            <!-- Documents -->
            <a
                href="{% url 'document_list' %}"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl px-3 py-3
                    text-sm font-medium transition-all duration-200
                    {% if request.resolver_match.url_name == 'document_list' %}
                        bg-emerald-700 text-white shadow-sm
                    {% else %}
                        text-emerald-100 hover:bg-emerald-800 hover:text-white
                    {% endif %}"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"
                    />
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14 2v6h6M8 13h8M8 17h6"
                    />
                </svg>

                <span>Documents</span>

            </a>


            <!-- Blockchain Logs -->
            <a
                href="{% url 'blockchain_logs' %}"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl px-3 py-3
                    text-sm font-medium transition-all duration-200
                    {% if request.resolver_match.url_name == 'blockchain_logs' %}
                        bg-emerald-700 text-white shadow-sm
                    {% else %}
                        text-emerald-100 hover:bg-emerald-800 hover:text-white
                    {% endif %}"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M9 7h6M9 12h6M9 17h6"
                    />
                    <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                </svg>

                <span>Blockchain Logs</span>

            </a>


            <!-- Reports -->
            <a
                href="#"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl
                       px-3 py-3 text-sm font-medium text-emerald-100
                       transition-all duration-200
                       hover:bg-emerald-800 hover:text-white"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M4 19V5M4 19h17"
                    />
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M8 16v-5M12 16V8M16 16v-8M20 16v-11"
                    />
                </svg>

                <span>Reports &amp; Analytics</span>

            </a>

        </div>


        <!-- ============================= -->
        <!-- SYSTEM -->
        <!-- ============================= -->

        <div>

            <p class="mb-3 px-3 text-[11px] font-bold uppercase tracking-widest text-emerald-400">
                System
            </p>


            <!-- Settings -->
            <a
                href="#"
                class="settings-toggle nav-item group mb-1 flex items-center gap-3
                       rounded-xl px-3 py-3 text-sm font-medium text-emerald-100
                       transition-all duration-200
                       hover:bg-emerald-800 hover:text-white"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06-1.7 1.7-.06-.06a1.7 1.7 0 00-1.88-.34 1.7 1.7 0 00-1.03 1.56V20h-2.4v-.2a1.7 1.7 0 00-1.03-1.56 1.7 1.7 0 00-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 008.46 15a1.7 1.7 0 00-1.56-1.03H6v-2.4h.9a1.7 1.7 0 001.56-1.03 1.7 1.7 0 00-.34-1.88l-.06-.06 1.7-1.7.06.06a1.7 1.7 0 001.88.34A1.7 1.7 0 0012.73 5V4h2.4v1a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.88-.34l.06-.06 1.7 1.7-.06.06a1.7 1.7 0 00-.34 1.88A1.7 1.7 0 0020.97 11H22v2.4h-1.03A1.7 1.7 0 0019.4 15z"
                    />
                </svg>

                <span>Settings</span>

            </a>


            <!-- User Management -->
            <a
                href="#"
                class="nav-item group mb-1 flex items-center gap-3 rounded-xl
                       px-3 py-3 text-sm font-medium text-emerald-100
                       transition-all duration-200
                       hover:bg-emerald-800 hover:text-white"
            >

                <svg
                    class="h-5 w-5 shrink-0 text-emerald-300
                           transition-colors group-hover:text-white"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                >
                    <circle cx="9" cy="7" r="4"></circle>

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M3 21v-2a6 6 0 016-6h0a6 6 0 016 6v2"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M16 11a4 4 0 100-8M21 21v-2a6 6 0 00-4-5.65"
                    />
                </svg>

                <span>User Management</span>

            </a>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- BOTTOM -->
    <!-- ============================= -->

    <div class="border-t border-emerald-800 px-4 py-4">

        <!-- Help -->
        <a
            href="#"
            class="nav-item group mb-1 flex items-center gap-3 rounded-xl
                   px-3 py-3 text-sm font-medium text-emerald-100
                   transition-all duration-200
                   hover:bg-emerald-800 hover:text-white"
        >

            <svg
                class="h-5 w-5 shrink-0 text-emerald-300
                       transition-colors group-hover:text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="1.8"
            >
                <circle cx="12" cy="12" r="9"></circle>

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9.5 9a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 3.5M12 16h.01"
                />
            </svg>

            <span>Help &amp; Support</span>

        </a>


        <!-- Sign Out -->
        <a
            href="{% url 'logout' %}"
            class="logout group flex items-center gap-3 rounded-xl
                   px-3 py-3 text-sm font-medium text-emerald-100
                   transition-all duration-200
                   hover:bg-red-500/20 hover:text-red-300"
        >

            <svg
                class="h-5 w-5 shrink-0 text-emerald-300
                       transition-colors group-hover:text-red-300"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
                stroke-width="1.8"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10 17l5-5-5-5"
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12H3"
                />

                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 19V5a2 2 0 00-2-2h-6"
                />
            </svg>

            <span>Sign Out</span>

        </a>

    </div>

</aside>
